name: Auto Unzip

on:
  push:
    paths:
      - '**.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Files and Clean Up
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Mengekstrak $f..."
            unzip -o "$f"
            rm "$f"
          done

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto unzip and remove zip files [skip ci]" && git push)
          
