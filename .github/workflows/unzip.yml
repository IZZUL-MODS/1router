name: Auto Unzip
on: [push]

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          for f in *.zip; do
            [ -e "$f" ] || continue
            unzip -o "$f"
            rm "$f"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto unzip files" && git push)
          
